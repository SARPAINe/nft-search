# nginx config for the dockerised frontend.
# Serves the built SPA and reverse-proxies API calls to the backend
# container so the browser sees a single origin (no CORS preflight,
# no VITE_API_URL gymnastics).

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Static assets — long cache, content-hashed filenames are safe to
    # freeze forever (vite mangles them on every build).
    location /assets/ {
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html must NEVER be cached — it's the pointer to the current
    # asset hashes. Without this header browsers can serve a stale
    # index.html that references deleted asset files.
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        expires off;
    }

    # API routes — namespaced under /api/ to keep them out of the SPA's
    # path space. `backend` resolves via docker's embedded DNS.
    location /api/ {
        proxy_pass         http://backend:4000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    # Direct liveness endpoint — proxied separately because it lives at
    # the root of the backend, outside /api/.
    location = /health {
        proxy_pass         http://backend:4000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        access_log         off;
    }

    # SPA fallback: everything else returns index.html so React Router
    # can take over on the client.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
