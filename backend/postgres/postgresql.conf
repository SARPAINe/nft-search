# Postgres 15 — tuned for NFT marketplace FTS workload (dev/small-prod box)
listen_addresses = '*'
max_connections = 100

# Memory
shared_buffers = 1GB
effective_cache_size = 4GB
work_mem = 256MB
maintenance_work_mem = 512MB

# Planner — SSD optimised
random_page_cost = 1.1
effective_io_concurrency = 200

# WAL / durability — reasonable defaults
wal_buffers = 16MB
checkpoint_completion_target = 0.9
min_wal_size = 80MB
max_wal_size = 1GB

# Logging — helpful while building search
log_min_duration_statement = 250ms
log_line_prefix = '%t [%p] %u@%d '
log_statement = 'none'

# Parallelism
max_worker_processes = 8
max_parallel_workers_per_gather = 4
max_parallel_workers = 8

# Statistics — better plans on text-heavy data
default_statistics_target = 200
